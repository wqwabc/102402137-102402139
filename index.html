<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园失物招领</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <a class="fab-avatar" href="my.html?edit=1" title="编辑我的信息">👤</a>
    <div class="page-title">校园失物招领</div>
    <div class="page-sub">信息每日更新 · 物归原主</div>

    <div class="searchbar">
      <div class="box">
        <span class="icon">🔍</span>
        <input id="kw" type="text" placeholder="搜索物品名称，如：雨伞、校园卡">
      </div>
    </div>

    <div class="cta-row">
      <a class="cta lost" href="publish.html?type=lost">
        <div class="emoji">📍</div>
        <div class="t">我丢了东西</div>
        <div class="s">发布寻物，让同学帮忙留意</div>
      </a>
      <a class="cta found" href="publish.html?type=found">
        <div class="emoji">🤲</div>
        <div class="t">我捡到东西</div>
        <div class="s">发布招领，尽快物归原主</div>
      </a>
    </div>

    <div class="stats" id="stats">今日新增 0 条信息 · 本周已成功归还 0 件物品</div>

    <div class="tabs">
      <div class="tab active" data-type="all">全部</div>
      <div class="tab" data-type="lost">寻物</div>
      <div class="tab" data-type="found">招领</div>
    </div>

    <div class="chips" id="catChips"></div>
    <div class="chips" id="locChips"></div>

    <div class="toolbar">
      <span class="count" id="count">共 0 条</span>
      <div class="sorts" id="sorts">
        <span class="sort active" data-sort="newest">🕒 最新</span>
        <span class="sort" data-sort="views">🔥 最热</span>
      </div>
    </div>

    <div class="list" id="list"></div>
    <div class="more" id="more"></div>

    <nav class="tabbar">
      <a href="index.html" data-page="home"><span class="ico">🏠</span>首页</a>
      <a href="search.html" data-page="search"><span class="ico">🔍</span>搜索</a>
      <a href="publish.html" data-page="publish"><span class="ico">➕</span>发布</a>
      <a href="my.html" data-page="my"><span class="ico">👤</span>我的</a>
    </nav>
  </div>

  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
